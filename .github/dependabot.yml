# Dependabot (review 134, H3): once a week it looks for newer versions of
# the actions the workflows use (named there by commit) and of the
# packages in package.json, and proposes them as pull requests, which
# the automatic builds check like any other. Minor and patch updates
# come together, one pull request for the actions and one for the
# packages; a major version comes on its own. At most five are open at
# a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the Node the code runs on, 24 (owner, prompt
      # 161 in the browser repository): a new major comes when the builds
      # move, not on its own (prompt 162).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # @types/vscode must not be newer than engines.vscode in
      # packages/vscode/package.json (^1.96.0), or vsce refuses to
      # package the extension; it moves when engines.vscode does.
      - dependency-name: '@types/vscode'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      packages:
        patterns: ['*']
        update-types: [minor, patch]
