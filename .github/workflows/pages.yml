# Publishes the HoloML site with GitHub Pages (browser milestone 22, owner
# prompt 128, Q3 a and Q7 a): the home page at https://srajpal.github.io/holoml/,
# the specification at /spec/, and the guides under /docs/, made by
# site/build.mjs, with the example sites at their addresses as before
# (the showroom at /showroom/ since milestone 16, and each other site
# since its own milestone), without the scripts that make them.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - SPEC.md
      - docs/**
      - examples/**
      - site/**
      - spec/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The site
        run: pnpm site:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
