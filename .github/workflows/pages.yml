# Publishes the HoloML site with GitHub Pages (browser milestone 22, owner
# prompt 128, Q3 a and Q7 a): the home page at https://srajpal.github.io/holoml/,
# the specification at /spec/, and the guides under /docs/, made by
# site/build.mjs, with the example sites at their addresses as before
# (the showroom at /showroom/ since milestone 16, and each other site
# since its own milestone), without the scripts that make them.
#
# Two jobs (review 134): "build" checks the code (lint, types, and the
# tests, as CI does) and makes the site, and may only read the
# repository; "deploy" publishes what "build" made, and is the only one
# that may write to Pages. It checks nothing out and installs nothing, so
# no other action and no package's script runs with that permission.
# Nothing is published unless the checks pass.
#
# Actions are named by commit, with their version beside them; Dependabot
# (.github/dependabot.yml) proposes their updates.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - SPEC.md
      - docs/**
      - examples/**
      - site/**
      - spec/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: The site
        run: pnpm site:build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
