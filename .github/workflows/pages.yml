# Publishes examples/ with GitHub Pages, so the showroom is at
# https://srajpal.github.io/holoml/showroom/ (browser milestone 16, owner
# prompt 81, Q1 a). Static files only; nothing is built.
name: Pages

on:
  push:
    branches: [main]
    paths: [examples/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: The site (without the scripts that make it)
        run: |
          mkdir -p _site
          cp -r examples/. _site/
          rm -rf _site/showroom/tools
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
