# Checks every push and pull request on Windows and Linux: lint, types,
# and the unit and conformance tests (milestone 13, owner prompt 63, Q4 a);
# and the VS Code extension (browser milestone 23): its .vsix made, and its
# tests run inside VS Code 1.96.0, which @vscode/test-electron downloads
# from Microsoft's update server and checks against the checksum the
# server gives (Q4 a: that download happens here only).
# Actions are named by commit, with their version beside them (review
# 134); Dependabot (.github/dependabot.yml) proposes their updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: VS Code extension, packaged
        run: pnpm --filter holoml-vscode package

      - name: VS Code extension, in VS Code (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter holoml-vscode test:vscode

      # Linux has no display: VS Code draws on a virtual one.
      - name: VS Code extension, in VS Code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter holoml-vscode test:vscode
